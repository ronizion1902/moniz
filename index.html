<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moniz</title>
<meta name="apple-mobile-web-app-title" content="Moniz">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#430C1B">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(120% 90% at 10% 100%, #8E3A52 0%, #430C1B 55%, #25050F 100%); color: #F2E4D0;
         font: 17px -apple-system, BlinkMacSystemFont, "Heebo", system-ui, sans-serif; display: grid; place-items: center; text-align: center; }
  .box { display: grid; gap: 18px; justify-items: center; padding: 24px; }
  img { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  a { color: #F2E4D0; opacity: .85; font-size: 15px; }
  .hint { max-width: 30ch; opacity: .75; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="box">
    <img src="icon-512.png" alt="Moniz">
    <h1>Moniz</h1>
    <p class="hint" id="hint">פותח את האפליקציה…</p>
    <a id="go" href="https://claude.ai/artifact/3ioCmGYMz4YTSgtPh1NGhi">לכניסה לאפליקציה</a>
  </div>
<script>
  // Remove the standalone app's service worker if it was installed at this address.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (!/\/app\/$/.test(r.scope)) r.unregister(); }); });

  // Opened from the home screen icon (web app mode): go straight to Moniz.
  var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (standalone) {
    setTimeout(function () { location.replace('https://claude.ai/artifact/3ioCmGYMz4YTSgtPh1NGhi'); }, 500);
  } else {
    document.getElementById('hint').textContent = 'להוספה למסך הבית: ⋯ ← שיתוף ← הוספה למסך הבית, ולהשאיר את "פתח כאפליקציית רשת" דלוק.';
  }
</script>
</body>
</html>
